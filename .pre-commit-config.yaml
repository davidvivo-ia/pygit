repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        files: ^src/pygit/
        additional_dependencies:
          - PySide6>=6.7
          - structlog>=24
          - platformdirs>=4.2
          - Babel>=2.15
        args: [--strict]
