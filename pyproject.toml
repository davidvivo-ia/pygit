[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pygit"
version = "0.1.0a0"
description = "Cliente Git de escritorio en Python para Windows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pygit contributors" }]
keywords = ["git", "gui", "desktop", "vcs", "pyside6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "PySide6>=6.7",
  "pygit2>=1.15",
  "qasync>=0.27",
  "qtawesome>=1.3",
  "qdarkstyle>=3.2",
  "Pygments>=2.18",
  "httpx>=0.27",
  "paramiko>=3.4",
  "cryptography>=42",
  "keyring>=25",
  "structlog>=24",
  "platformdirs>=4.2",
  "Babel>=2.15",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-qt>=4.4",
  "pytest-asyncio>=0.23",
  "pre-commit>=3.7",
  "pip-tools>=7.4",
  "types-Pygments",
  "types-paramiko",
]

[project.scripts]
pygit = "pygit.app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pygit"]

[tool.hatch.build.targets.sdist]
include = ["src/pygit", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/pygit/ui/i18n/__init__.py" = ["A001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/pygit", "tests"]

[[tool.mypy.overrides]]
module = [
  "qasync",
  "qdarkstyle",
  "qtawesome",
  "pygit2.*",
  "pytestqt.*",
  "babel.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"
addopts = "-ra --strict-markers"
